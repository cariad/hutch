[tasks.fix]
description = "Fix lint and formatting problems where possible"
run = [
  "uv run ruff check --fix",
  "uv run ruff format",
  "uv run rumdl check --fix .",
]

[tasks.lint]
description = "Check for lint and formatting problems"
run = [
  "uv run ruff check",
  "uv run ruff format --check",
  "uv run rumdl check .",
  "zizmor --format=\"${ZIZMOR_FORMAT:-plain}\" .",
]

[tasks.test]
description = "Run the unit tests"
run = "uv run pytest"

[tools]
uv = "0.13.5"
zizmor = "1.32.0"
