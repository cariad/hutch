[project]
authors = [
  { name = "Cariad Eccleston", email = "cariad@cariad.earth" },
]
classifiers = [
  "Development Status :: 1 - Planning",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]
description = "Website hosting in bunny.net"
dynamic = [
  "version",
]
license = "MIT"
license-files = [
  "LICENSE",
]
name = "hutch"
readme = "README.md"
requires-python = ">=3.14"

[project.scripts]
hutch = "hutch.cli:main"

[project.urls]
Repository = "https://github.com/cariad/hutch"

[build-system]
requires = [
  "hatch-vcs",
  "hatchling",
]
build-backend = "hatchling.build"

[tool.hatch.version]
fallback-version = "0.0.0"
source = "vcs"

[tool.uv]
cache-keys = [
  { git = { commit = true, tags = true } },
  { file = "pyproject.toml" },
]

[dependency-groups]
dev = [
  "pytest>=9.2.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.17.6",
  "rumdl>=0.3.7",
]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.coverage.run]
branch = true
source = [
  "hutch",
]

[tool.ruff.lint]
extend-select = [
  "D",    # Docstrings
  "D213", # Multi-line docstring summaries start on the second line
]
ignore = [
  "D100", # Modules don't need docstrings
  "D104", # Packages don't need docstrings
  "D202", # Blank line after docstring
  "D212", # Multi-line docstrings start on the next line
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
addopts = [
  "--cov",
]
testpaths = [
  "tests",
]
