name: Release

on:
  release:
    types:
      - published

permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
          version: "0.13.5"

      # uv.lock doesn't lock the build's own tools (hatchling, hatch-vcs), so only
      # accept releases of them that are at least 7 days old.
      - name: Build
        run: uv build --exclude-newer "7 days"

      - name: Check the build has the tag's version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ls dist
          test -f "dist/hutch-${TAG#v}.tar.gz"

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hutch
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
          version: "0.13.5"

      - name: Publish
        run: uv publish --trusted-publishing always
